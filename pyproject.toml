[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-asset-audit"
version = "0.1.1"
description = "Asset auditing app for Alliance Auth"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
	"allianceauth>=4.0.0",
	"celery>=5.3,<6",
	"django-esi>=10",
]

[tool.setuptools.packages.find]
include = ["asset_audit*"]

[tool.setuptools.package-data]
asset_audit = ["templates/asset_audit/*.html"]